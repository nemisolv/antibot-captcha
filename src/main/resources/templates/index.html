<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Captcha Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div th:if="${message}"
         th:text="${message}"
         th:class="${success}
        ? 'mb-4 rounded-lg bg-green-100 text-green-700 px-4 py-3'
        : 'mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-3'">
    </div>

    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
        🤖 Are you a robot?
    </h1>

    <div class="flex justify-center mb-6">
        <img class="rounded-lg border border-gray-300"
             th:src="${captchaChallenge.image}"
             alt="Captcha">
    </div>

    <form th:action="@{/verify}" method="post" class="space-y-4">
        <input type="hidden"
               name="captchaId"
               th:value="${captchaChallenge.captchaId}">
        <input
                type="text"
                name="answer"
                placeholder="Enter the text above"
                class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
            Verify
        </button>

    </form>

</div>

</body>
</html>
